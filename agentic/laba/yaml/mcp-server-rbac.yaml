# ServiceAccount + RBAC for the real MCP server (mcp-deployment.yaml).
#
# mcp-server.py shells out to kubectl for its tools:
#   get_pods            -> kubectl get pods -o wide
#   get_logs            -> kubectl logs deployment/<name> --tail=20
#   restart_deployment  -> kubectl rollout restart deployment/<name>
#
# A ClusterRole is used so the tools work across namespaces in this lab.
# In production you would scope this down to Roles in specific namespaces.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: mcp-gateway

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-tools
rules:

# get_pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# get_logs
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

# restart_deployment (rollout restart = patch on the deployment)
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-tools
subjects:
- kind: ServiceAccount
  name: mcp-server-sa
  namespace: mcp-gateway
roleRef:
  kind: ClusterRole
  name: mcp-server-tools
  apiGroup: rbac.authorization.k8s.io
